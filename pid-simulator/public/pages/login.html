<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — PID Simulator</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-panel">
      <h1>PID Simulator</h1>
      <p class="subtitle">Entre para configurar e rodar simulações.</p>

      <div class="error-message" id="error-message"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="full">Entrar</button>
      </form>

      <p class="form-footer">Ainda não tem conta? <a href="register.html">Criar conta</a></p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
