<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — PID Simulator</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-screen">
    <div class="auth-panel">
      <h1>Criar conta</h1>
      <p class="subtitle">Leva menos de um minuto.</p>

      <div class="error-message" id="error-message"></div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="field">
          <label for="name">Nome</label>
          <input type="text" id="name" required autocomplete="name">
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="full">Criar conta</button>
      </form>

      <p class="form-footer">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
